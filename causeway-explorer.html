<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Causeway Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Tailwind CDN (preflight disabled — avoids resetting component styles) -->
  <script>window.tailwind={config:{corePlugins:{preflight:false}}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── Design tokens (mirrored from portfolio) ───────────────── */
    :root {
      --navy:        #1a2535;
      --navy-light:  #243044;
      --blue:        #2456A5;
      --blue-light:  #4595D7;
      --orange:      #FA872E;
      --slate:       #f4f6f8;
      --slate-mid:   #e2e8f0;
      --white:       #ffffff;
      --ink:         #1a2535;
      --ink-mid:     #3d4f62;
      --ink-muted:   #7a8fa3;
      --ink-faint:   #b0bfcc;
      --font-display: 'Aleo', Georgia, serif;
      --font-body:    'Inter', system-ui, sans-serif;
    }

    /* ── Page reset ────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-body);
      background: var(--slate);
      color: var(--ink);
      height: 100vh;
      overflow: hidden;
    }

    /* ── Catalog container ─────────────────────────────────────── */
    #causeway-explorer {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Causeway catalog UI ───────────────────────────────────── */
    @keyframes cwc-rotate { to { transform: rotate(360deg); } }
    .cwc-spin { width:30px;height:30px;border:3px solid var(--slate-mid);border-top-color:var(--blue);border-radius:50%;animation:cwc-rotate .7s linear infinite;margin:0 auto 1rem; }

    .cwc-catalog { flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden; }

    .cwc-hdr { display:flex;align-items:center;gap:.75rem;padding:.75rem 1.1rem;background:var(--navy);flex-shrink:0;flex-wrap:wrap; }
    .cwc-hdr-title { font-family:var(--font-display);font-size:.95rem;color:var(--white);font-weight:400;letter-spacing:-.01em; }
    #cwc-ver { font-size:.62rem;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:3px;background:var(--orange);color:var(--navy); }
    .cwc-ms { font-size:.68rem;color:rgba(255,255,255,.25); }
    .cwc-hdr-search { flex:1;min-width:160px;max-width:300px;margin-left:auto; }
    .cwc-search-inp { width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:.4rem .8rem;font-family:var(--font-body);font-size:.8rem;color:var(--white);outline:none; }
    .cwc-search-inp::placeholder { color:rgba(255,255,255,.28); }
    .cwc-search-inp:focus { border-color:rgba(197,232,74,.4); }
    .cwc-cnt { font-size:.68rem;color:rgba(255,255,255,.28);white-space:nowrap; }

    .cwc-body { display:flex;flex:1;overflow:hidden; }

    .cwc-nav { width:185px;flex-shrink:0;background:var(--slate);border-right:1px solid var(--slate-mid);overflow-y:auto;padding:.4rem 0; }
    .cwc-nav-item { display:flex;align-items:center;justify-content:space-between;width:100%;padding:.45rem .9rem;font-family:var(--font-body);font-size:.76rem;font-weight:500;color:var(--ink-mid);background:none;border:none;cursor:pointer;text-align:left;transition:background .12s,color .12s;border-left:2px solid transparent; }
    .cwc-nav-item:hover { background:var(--slate-mid);color:var(--navy); }
    .cwc-nav-item.active { background:var(--white);color:var(--navy);font-weight:600;border-left-color:var(--blue); }
    .cwc-nav-ct { font-size:.62rem;color:var(--ink-faint);font-weight:400; }
    .cwc-nav-item.active .cwc-nav-ct { color:var(--ink-muted); }

    .cwc-main { flex:1;overflow-y:auto;padding:1rem;display:block;background:var(--slate); }
    .cwc-card + .cwc-card { margin-top:1rem; }

    .cwc-card { background:var(--white);border:1px solid var(--slate-mid);border-radius:8px;overflow:hidden; }
    .cwc-card-head { display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;padding:.9rem 1.1rem;border-bottom:1px solid var(--slate-mid); }
    .cwc-card-meta { display:flex;flex-direction:column;gap:.2rem;min-width:0; }
    .cwc-card-tag { font-size:.82rem;font-weight:600;color:var(--navy);font-family:'Courier New',monospace; }
    .cwc-card-sum { font-size:.75rem;color:var(--ink-muted);line-height:1.5; }
    .cwc-card-acts { display:flex;align-items:center;gap:.4rem;flex-shrink:0;flex-wrap:wrap; }
    .cwc-pill { font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--slate);color:var(--ink-muted); }
    .cwc-code-btn { font-size:.68rem;font-weight:600;letter-spacing:.03em;color:var(--blue);background:none;border:1px solid var(--slate-mid);border-radius:4px;padding:2px 9px;cursor:pointer;transition:background .12s; }
    .cwc-code-btn:hover,.cwc-code-btn.active { background:var(--slate); }

    .cwc-props-panel { border-bottom:1px solid var(--slate-mid);background:var(--slate);overflow-x:auto; }
    table.cwc-tbl { width:100%;border-collapse:collapse;font-size:.72rem; }
    table.cwc-tbl th { text-align:left;padding:.45rem .9rem;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--slate-mid); }
    table.cwc-tbl td { padding:.35rem .9rem;color:var(--ink-mid);border-bottom:1px solid rgba(0,0,0,.04);vertical-align:top;line-height:1.5; }
    table.cwc-tbl td code { font-size:.69rem;background:var(--slate-mid);padding:1px 4px;border-radius:2px;color:var(--navy); }
    table.cwc-tbl tr:last-child td { border-bottom:none; }

    .cwc-note { padding:.75rem 1.1rem;font-size:.78rem;color:var(--ink-muted);background:var(--slate);border-top:1px solid var(--slate-mid);font-style:italic; }

    .cwc-examples { padding:0; }
    .cwc-ex-tabs { display:flex;background:var(--slate);border-bottom:1px solid var(--slate-mid);overflow-x:auto; }
    .cwc-ex-tab { font-family:var(--font-body);font-size:.7rem;font-weight:500;color:var(--ink-muted);background:none;border:none;border-bottom:2px solid transparent;padding:.55rem .9rem;cursor:pointer;white-space:nowrap;transition:color .12s,border-color .12s; }
    .cwc-ex-tab:hover { color:var(--navy); }
    .cwc-ex-tab.active { color:var(--blue);border-bottom-color:var(--blue);background:var(--white);font-weight:600; }
    .cwc-ex-pane { display:none; }
    .cwc-ex-pane.active { display:block; }
    .cwc-demo { padding:2.5rem;background:var(--white);border-bottom:1px solid var(--slate-mid);min-height:52px;font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased; }
    .cwc-demo--shell { height:150px;overflow:hidden;pointer-events:none; }
    .cwc-code-wrap { display:none;background:#0f172a; }
    .cwc-card.cwc-code-open .cwc-code-wrap { display:block; }
    .cwc-pre { margin:0;padding:.9rem 1.1rem;overflow-x:auto;font-size:.7rem;line-height:1.7;color:#94a3b8;white-space:pre-wrap;word-break:break-word; }
    .cwc-pre code { font-family:'Courier New',monospace; }
  </style>
</head>
<body>

  <div id="causeway-explorer">

    <!-- Loading state -->
    <div id="cwc-init" style="padding:3rem 2rem;background:var(--white);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
      <div class="cwc-spin"></div>
      <div style="font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);">Initializing Causeway…</div>
    </div>

    <!-- Error state -->
    <div id="cwc-err" style="display:none;padding:1.5rem;background:var(--white);flex:1;">
      <div style="font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#ef4444;margin-bottom:.5rem;">Load error</div>
      <p id="cwc-err-msg" style="font-size:.85rem;color:var(--ink-muted);margin-bottom:1rem;"></p>
      <p style="font-size:.78rem;color:var(--ink-faint);">CDN: <code>https://bcdn.infotechinc.com/causeway/</code></p>
    </div>

    <!-- Catalog -->
    <div id="cwc-catalog" class="cwc-catalog" style="display:none;">
      <div class="cwc-hdr">
        <span class="cwc-hdr-title">Causeway</span>
        <span id="cwc-ver"></span>
        <span id="cwc-ms" class="cwc-ms"></span>
        <div class="cwc-hdr-search">
          <input id="cwc-search" class="cwc-search-inp" type="search" placeholder="Search components…" autocomplete="off" />
        </div>
        <span id="cwc-cnt" class="cwc-cnt"></span>
      </div>
      <div class="cwc-body">
        <nav id="cwc-nav" class="cwc-nav"></nav>
        <main id="cwc-main" class="cwc-main"></main>
      </div>
    </div>

  </div>

  <script>
  // ── Causeway Component Catalog ──────────────────────────────────
  (function () {
    const CATS = [
      { id:'buttons',  label:'Buttons & Actions',   tags:['cw-button','cw-toggle'] },
      { id:'forms',    label:'Form Elements',        tags:['cw-checkbox','cw-checkbox-group','cw-field-errors','cw-field-group','cw-field-set','cw-form','cw-h-checkbox','cw-h-checkbox-group','cw-h-radio-button','cw-h-radio-group','cw-input','cw-input-date','cw-input-datetime','cw-input-file','cw-input-file-button','cw-input-file-drop','cw-input-file-status','cw-input-markdown','cw-input-number','cw-input-password','cw-input-search','cw-input-time','cw-radio-button','cw-radio-group','cw-select','cw-select-group','cw-select-option','cw-textarea'] },
      { id:'feedback', label:'Feedback & Overlays',  tags:['cw-alert','cw-callout','cw-empty-state','cw-modal','cw-modal-header-marketing','cw-overlay','cw-slideout'] },
      { id:'status',   label:'Status & Display',     tags:['cw-avatar','cw-avatar-stack','cw-badge','cw-indicator','cw-loader','cw-progress','cw-step','cw-stepper','cw-tag','cw-tag-collection'] },
      { id:'nav',      label:'Navigation',           tags:['cw-breadcrumb','cw-breadcrumbs','cw-dropdown-menu','cw-dropdown-menu-group','cw-dropdown-menu-item','cw-pagination','cw-segmented-switch','cw-segmented-switches','cw-tab','cw-tabs'] },
      { id:'layout',   label:'Layout & Cards',       tags:['cw-calendar','cw-card','cw-header','cw-icon','cw-popover','cw-tooltip'] },
    ];

    const NEEDS_ARCGIS = new Set(['cw-map']);
    const NEEDS_APEX   = new Set(['cw-chart']);
    const APP_SHELL    = new Set(['cw-app-layout','cw-bidx-app-layout','cw-app-header','cw-app-sidebar']);
    const SKIP_DEMO    = new Set(['cw-script-builder']);

    let manifest  = null;
    let cwVersion = null;
    let activeCat = 'buttons';

    function esc(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function loadScript(src) {
      return new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = src; s.onload = res; s.onerror = rej;
        document.head.appendChild(s);
      });
    }

    function byId(id) { return document.getElementById(id); }

    // ── boot ───────────────────────────────────────────────────
    async function init() {
      try {
        const t0 = Date.now();
        const vRes = await fetch('https://assets.infotechinc.com/causeway-sdk/latest');
        cwVersion  = (await vRes.text()).trim();

        const [, mData] = await Promise.all([
          loadScript(`https://bcdn.infotechinc.com/causeway/v${cwVersion}/all.umd.js`),
          fetch(`https://assets.infotechinc.com/causeway-sdk/v${cwVersion}/manifest.json`).then(r => r.json()),
        ]);
        manifest = mData;

        const ms = Date.now() - t0;
        buildCatalog(ms);
      } catch (err) {
        byId('cwc-init').style.display = 'none';
        byId('cwc-err').style.display  = 'flex';
        byId('cwc-err-msg').textContent = err.message;
      }
    }

    // ── build catalog shell ────────────────────────────────────
    function buildCatalog(ms) {
      byId('cwc-init').style.display    = 'none';
      byId('cwc-catalog').style.display = 'flex';

      byId('cwc-ver').textContent = 'v' + cwVersion;
      byId('cwc-ms').textContent  = ms + 'ms';
      byId('cwc-cnt').textContent = manifest.components.length + ' components';

      buildNav();
      renderCat(activeCat);

      byId('cwc-search').addEventListener('input', (e) => {
        const q = e.target.value.trim();
        if (q) { renderSearch(q); } else { renderCat(activeCat); }
      });
    }

    // ── sidebar nav ────────────────────────────────────────────
    function buildNav() {
      const nav = byId('cwc-nav');
      nav.innerHTML = '';
      CATS.forEach(cat => {
        const count = manifest.components.filter(c => cat.tags.includes(c.tag)).length;
        const btn = document.createElement('button');
        btn.className = 'cwc-nav-item' + (cat.id === activeCat ? ' active' : '');
        btn.innerHTML = `<span>${cat.label}</span><span class="cwc-nav-ct">${count}</span>`;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.cwc-nav-item').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeCat = cat.id;
          byId('cwc-search').value = '';
          renderCat(cat.id);
          byId('cwc-main').scrollTop = 0;
        });
        nav.appendChild(btn);
      });
    }

    // ── render by category ─────────────────────────────────────
    function renderCat(catId) {
      const cat   = CATS.find(c => c.id === catId);
      const comps = manifest.components.filter(c => cat.tags.includes(c.tag));
      renderComponents(comps);
    }

    // ── render search results ──────────────────────────────────
    function renderSearch(q) {
      const lq    = q.toLowerCase();
      const comps = manifest.components.filter(c =>
        c.tag.includes(lq) || (c.summary || '').toLowerCase().includes(lq)
      );
      renderComponents(comps);
    }

    // ── render component list ──────────────────────────────────
    function renderComponents(comps) {
      const main = byId('cwc-main');
      main.innerHTML = '';
      if (!comps.length) {
        main.innerHTML = '<div style="padding:2rem;color:var(--ink-faint);text-align:center;font-size:.85rem;">No components match.</div>';
        return;
      }
      comps.forEach(comp => main.appendChild(buildCard(comp)));
    }

    // ── sanitize example code ──────────────────────────────────
    function sanitizeCode(tag, exIdx, code) {
      const slug = tag.replace(/^cw-/, '');
      let c = code;
      // Unique trigger/dismiss IDs
      c = c.replace(/id="foo-open"/g,            `id="${slug}-${exIdx}-trigger"`);
      c = c.replace(/id="foo-close"/g,           `id="${slug}-${exIdx}-dismiss"`);
      c = c.replace(/for="foo-open foo-close"/g, `for="${slug}-${exIdx}-trigger ${slug}-${exIdx}-dismiss"`);
      c = c.replace(/for="foo-open"/g,           `for="${slug}-${exIdx}-trigger"`);
      // Global
      c = c.replace(/content="My content"/g, 'content="Save changes"');
      // Tag-specific
      if (tag === 'cw-button') {
        const themeLabels = { primary:'Primary', secondary:'Secondary', destructive:'Destructive' };
        for (const [theme, label] of Object.entries(themeLabels)) {
          c = c.replace(new RegExp(`(theme="${theme}"[^>]*)content="Save changes"`, 'g'), `$1content="${label}"`);
          c = c.replace(new RegExp(`content="Save changes"([^>]*theme="${theme}")`, 'g'), `content="${label}"$1`);
        }
        c = c.replace(/content="Save changes"/g, 'content="Primary"');
      }
      if (tag === 'cw-tooltip') {
        c = c.replace(/id="foo"/g,          `id="tip-target-${exIdx}"`);
        c = c.replace(/for="foo"/g,         `for="tip-target-${exIdx}"`);
        c = c.replace(/I'm complicated\./g, 'Hover for details');
        c = c.replace(/I explain stuff/g,   'Provides additional context');
      }
      if (['cw-checkbox-group','cw-radio-group','cw-checkbox','cw-radio-button','cw-h-radio-button','cw-h-radio-group'].includes(tag)) {
        c = c.replace(/label="Foo Bar"/g, 'label="Road + Bridge"');
        c = c.replace(/label="Foo"/g,     'label="Road project"');
        c = c.replace(/label="Bar"/g,     'label="Bridge inspection"');
        c = c.replace(/>Foo Bar</g,       '>Road + Bridge<');
        c = c.replace(/>Foo</g,           '>Road project<');
        c = c.replace(/>Bar</g,           '>Bridge inspection<');
        c = c.replace(/Option 1/g, 'Road project');
        c = c.replace(/Option 2/g, 'Bridge inspection');
        c = c.replace(/Option 3/g, 'Utility work');
      }
      if (tag === 'cw-dropdown-menu-item' || tag === 'cw-dropdown-menu') {
        c = c.replace(/content="Foo"/g, 'content="Edit"');
        c = c.replace(/content="Bar"/g, 'content="Archive"');
      }
      if (tag === 'cw-tab' || tag === 'cw-tabs') {
        c = c.replace(/content="Tab one"/g, 'content="Overview"');
      }
      if (tag === 'cw-tag' || tag === 'cw-tag-collection' || tag === 'cw-badge') {
        c = c.replace(/content="foo"/g, 'content="In progress"');
        c = c.replace(/theme="specter"/g, 'theme="emerald"');
        c = c.replace(new RegExp(`<${tag}(\\s[^/>]*)?(\\s*\\/?>)`, 'g'), (m, attrs, close) => {
          attrs = attrs || '';
          if (/\btheme=/.test(attrs)) return m;
          return `<${tag}${attrs} theme="emerald"${close}`;
        });
        if (tag === 'cw-tag-collection') {
          c = c.replace(/<cw-tag(?!-collection)(\s[^/>]*)?(\/?>)/g, (m, attrs, close) => {
            attrs = attrs || '';
            if (/\btheme=/.test(attrs)) return m;
            return `<cw-tag${attrs} theme="emerald"${close}`;
          });
        }
      }
      if (tag === 'cw-step' || tag === 'cw-stepper') {
        c = c.replace(/label="Foo"/g,     'label="Select project"');
        c = c.replace(/label="Bar"/g,     'label="Review details"');
        c = c.replace(/label="Foo Bar"/g, 'label="Confirm"');
      }
      if (tag === 'cw-overlay' || tag === 'cw-slideout') {
        c = c.replace(/heading="Foo"/g, 'heading="Project details"');
      }
      if (tag === 'cw-toggle') {
        c = c.replace(/Dark mode/g, 'Favorites');
      }
      if (tag === 'cw-segmented-switches' || tag === 'cw-segmented-switch') {
        c = c.replace(/Foo Text/g, 'Active');
        c = c.replace(/Bar Text/g, 'Closed');
      }
      if (tag === 'cw-field-errors') {
        c = c.replace(/label="Foo"/g, 'label="This field is required"');
        c = c.replace(/>Foo</g,       '>This field is required<');
        c = c.replace(/error="Foo"/g, 'error="This field is required"');
      }
      if (tag === 'cw-form') {
        c = c.replace(/label="Foo"/g, 'label="Project name"');
        c = c.replace(/label="Bar"/g, 'label="Owner"');
        c = c.replace(/>Foo</g,       '>Project name<');
        c = c.replace(/>Bar</g,       '>Owner<');
      }
      if (tag === 'cw-select' || tag === 'cw-select-group' || tag === 'cw-select-option') {
        c = c.replace(/title="Foos?"/gi,   'title="Projects"');
        c = c.replace(/title="Bars?"/gi,   'title="Inspections"');
        c = c.replace(/>FOOS?</g,          '>PROJECTS<');
        c = c.replace(/>BARS?</g,          '>INSPECTIONS<');
        c = c.replace(/label="Foo 1"/g,    'label="Road project"');
        c = c.replace(/label="Foo 2"/g,    'label="Bridge inspection"');
        c = c.replace(/label="Foo 3"/g,    'label="Utility work"');
        c = c.replace(/label="Bar 1"/g,    'label="Site survey"');
        c = c.replace(/label="Bar 2"/g,    'label="Permit review"');
        c = c.replace(/label="Foo"/g,      'label="Road project"');
        c = c.replace(/label="Bar"/g,      'label="Bridge inspection"');
        c = c.replace(/>Foo 1</g,          '>Road project<');
        c = c.replace(/>Foo 2</g,          '>Bridge inspection<');
        c = c.replace(/>Foo 3</g,          '>Utility work<');
        c = c.replace(/>Bar 1</g,          '>Site survey<');
        c = c.replace(/>Bar 2</g,          '>Permit review<');
        c = c.replace(/>Foo</g,            '>Road project<');
        c = c.replace(/>Bar</g,            '>Bridge inspection<');
        c = c.replace(/value="foo1?"/g,    'value="road-project"');
        c = c.replace(/value="foo2"/g,     'value="bridge-inspection"');
        c = c.replace(/value="bar1?"/g,    'value="site-survey"');
        c = c.replace(/value="bar2"/g,     'value="permit-review"');
      }
      // ── Global catch-alls ──
      c = c.replace(/label="Foo Bar"/g,   'label="Road + Bridge"');
      c = c.replace(/label="Foo 1"/g,     'label="Road project"');
      c = c.replace(/label="Foo 2"/g,     'label="Bridge inspection"');
      c = c.replace(/label="Foo 3"/g,     'label="Utility work"');
      c = c.replace(/label="Bar 1"/g,     'label="Site survey"');
      c = c.replace(/label="Bar 2"/g,     'label="Permit review"');
      c = c.replace(/label="Foo"/g,       'label="Project name"');
      c = c.replace(/label="Bar"/g,       'label="Description"');
      c = c.replace(/title="Foos?"/gi,    'title="Projects"');
      c = c.replace(/title="Bars?"/gi,    'title="Inspections"');
      c = c.replace(/placeholder="Foo"/g, 'placeholder="Search projects…"');
      c = c.replace(/placeholder="Bar"/g, 'placeholder="Enter value…"');
      c = c.replace(/value="Foo Bar"/g,   'value="road-bridge"');
      c = c.replace(/value="Foo 1"/g,     'value="road-project"');
      c = c.replace(/value="Foo 2"/g,     'value="bridge-inspection"');
      c = c.replace(/value="Foo 3"/g,     'value="utility-work"');
      c = c.replace(/value="Foo"/g,       'value="road-project"');
      c = c.replace(/value="Bar"/g,       'value="bridge"');
      c = c.replace(/caption="Foo Bar"/g, 'caption="Road + Bridge"');
      c = c.replace(/caption="Foo 1"/g,   'caption="Road project"');
      c = c.replace(/caption="Foo 2"/g,   'caption="Bridge inspection"');
      c = c.replace(/caption="Foo"/g,     'caption="Road project"');
      c = c.replace(/caption="Bar"/g,     'caption="Bridge inspection"');
      c = c.replace(/name="foo"/g,        'name="project"');
      c = c.replace(/name="bar"/g,        'name="description"');
      c = c.replace(/heading="Bar"/g,     'heading="Inspection details"');
      c = c.replace(/content="Foo Bar"/g, 'content="Road + Bridge"');
      c = c.replace(/content="Foo"/g,     'content="Road project"');
      c = c.replace(/content="Bar"/g,     'content="Bridge inspection"');
      c = c.replace(/>Foo Bar</g,  '>Road + Bridge<');
      c = c.replace(/>Foo 1</g,    '>Road project<');
      c = c.replace(/>Foo 2</g,    '>Bridge inspection<');
      c = c.replace(/>Foo 3</g,    '>Utility work<');
      c = c.replace(/>Bar 1</g,    '>Site survey<');
      c = c.replace(/>Bar 2</g,    '>Permit review<');
      c = c.replace(/>FOOS?</g,    '>PROJECTS<');
      c = c.replace(/>BARS?</g,    '>INSPECTIONS<');
      c = c.replace(/>Foo</g,      '>Road project<');
      c = c.replace(/>Bar</g,      '>Bridge inspection<');
      c = c.replace(/\bFoo Bar\b/g, 'Road + Bridge');
      c = c.replace(/\bFoo 1\b/g,   'Road project');
      c = c.replace(/\bFoo 2\b/g,   'Bridge inspection');
      c = c.replace(/\bFoo 3\b/g,   'Utility work');
      c = c.replace(/\bBar 1\b/g,   'Site survey');
      c = c.replace(/\bBar 2\b/g,   'Permit review');
      c = c.replace(/\bFOOS\b/g,    'PROJECTS');
      c = c.replace(/\bBARS\b/g,    'INSPECTIONS');
      return c;
    }

    // ── build one component card ───────────────────────────────
    function buildCard(comp) {
      const card     = document.createElement('div');
      card.className = 'cwc-card';
      card.dataset.tag = comp.tag;

      const examples = comp.examples || [];
      const props    = comp.props    || [];

      let note = '';
      if (NEEDS_ARCGIS.has(comp.tag)) note = 'Requires ArcGIS SDK — live demo not available in this catalog.';
      if (NEEDS_APEX.has(comp.tag))   note = 'Requires ApexCharts — live demo not available in this catalog.';
      if (SKIP_DEMO.has(comp.tag))    note = 'No examples available in the manifest for this component.';

      const isShell  = APP_SHELL.has(comp.tag);
      const showDemo = !note && examples.length > 0;

      const headHtml = `
        <div class="cwc-card-head">
          <div class="cwc-card-meta">
            <span class="cwc-card-tag">${comp.tag}</span>
            <span class="cwc-card-sum">${comp.summary || ''}</span>
          </div>
          <div class="cwc-card-acts">
            ${examples.length ? `<span class="cwc-pill">${examples.length} example${examples.length > 1 ? 's' : ''}</span>` : ''}
            ${showDemo ? `<button class="cwc-code-btn">Code</button>` : ''}
          </div>
        </div>`;

      const noteHtml = note ? `<div class="cwc-note">${note}</div>` : '';

      let exHtml = '';
      if (showDemo) {
        const tabsHtml = examples.length > 1
          ? `<div class="cwc-ex-tabs">${examples.map((ex, i) =>
              `<button class="cwc-ex-tab${i === 0 ? ' active' : ''}" data-idx="${i}">${esc(ex.name)}</button>`
            ).join('')}</div>`
          : '';

        const panesHtml = examples.map((ex, i) => {
          const sanitized = sanitizeCode(comp.tag, i, ex.code);
          const skipLive  = comp.tag === 'cw-overlay' && ex.code.includes(' fixed');
          const demoClass = 'cwc-demo' + (isShell ? ' cwc-demo--shell' : '');
          return `
            <div class="cwc-ex-pane${i === 0 ? ' active' : ''}" data-idx="${i}">
              ${skipLive ? '' : `<div class="${demoClass}">${sanitized}</div>`}
              <div class="cwc-code-wrap">
                <pre class="cwc-pre"><code>${esc(sanitized.trim())}</code></pre>
              </div>
            </div>`;
        }).join('');

        exHtml = `<div class="cwc-examples">${tabsHtml}${panesHtml}</div>`;
      }

      let propsHtml = '';
      if (props.length) {
        propsHtml = `
          <div class="cwc-props-panel">
            <table class="cwc-tbl">
              <thead><tr><th>Prop</th><th>Type</th><th>Default</th><th>Description</th></tr></thead>
              <tbody>
                ${props.map(p => {
                  let type = p.type || '—';
                  if (comp.tag === 'cw-button' && p.name === 'theme') {
                    type = type.replace(/\|?'midnight-100'/g,'').replace(/\|?'midnight-400'/g,'').replace(/\|?'midnight'/g,'').replace(/\|?'amethyst'/g,'').replace(/^\|/,'');
                  }
                  return `<tr>
                    <td><code>${esc(p.name)}</code></td>
                    <td><code style="font-size:.65rem;white-space:pre-wrap;">${esc(type)}</code></td>
                    <td>${p.default !== undefined && p.default !== '' ? `<code>${esc(String(p.default))}</code>` : '—'}</td>
                    <td>${esc(p.summary || '')}</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>`;
      }

      card.innerHTML = headHtml + noteHtml + exHtml + propsHtml;

      const codeBtn = card.querySelector('.cwc-code-btn');
      if (codeBtn) {
        codeBtn.addEventListener('click', () => {
          card.classList.toggle('cwc-code-open');
          codeBtn.classList.toggle('active');
        });
      }

      card.querySelectorAll('.cwc-ex-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = btn.dataset.idx;
          card.querySelectorAll('.cwc-ex-tab').forEach(b => b.classList.remove('active'));
          card.querySelectorAll('.cwc-ex-pane').forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          card.querySelector(`.cwc-ex-pane[data-idx="${idx}"]`).classList.add('active');
        });
      });

      return card;
    }

    // ── boot on load ───────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', init);
  })();
  </script>

</body>
