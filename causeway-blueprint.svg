<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="700" height="420" fill="#0f1a28"/>
  <rect width="700" height="420" fill="url(#dots)"/>

  <!-- Corner registration marks -->
  <line x1="20" y1="8"  x2="20" y2="36" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="8"  y1="20" x2="36" y2="20" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="20" cy="20" r="2.5" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>

  <line x1="680" y1="8"  x2="680" y2="36" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="664" y1="20" x2="692" y2="20" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="680" cy="20" r="2.5" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>

  <line x1="20"  y1="384" x2="20"  y2="412" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="8"   y1="400" x2="36"  y2="400" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="20" cy="400" r="2.5" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>

  <line x1="680" y1="384" x2="680" y2="412" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="664" y1="400" x2="692" y2="400" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="680" cy="400" r="2.5" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>


  <!-- ═══════════════════════════════
       cw-card  (left)
       x=40 y=68 w=264 h=212 rx=8
  ══════════════════════════════════ -->
  <text x="40" y="58" font-family="'Courier New',Courier,monospace" font-size="10" fill="#4595D7" letter-spacing="0.08em">cw-card</text>

  <!-- Card body -->
  <rect x="40" y="68" width="264" height="212" rx="8"
        fill="rgba(255,255,255,0.025)"
        stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="6 3"/>

  <!-- Card header band -->
  <rect x="41" y="69" width="262" height="43" rx="7"
        fill="rgba(255,255,255,0.06)"/>
  <rect x="41" y="92"  width="262" height="20"
        fill="rgba(255,255,255,0.06)"/>

  <!-- Header skeleton text -->
  <rect x="58" y="84" width="108" height="8" rx="2" fill="rgba(255,255,255,0.2)"/>

  <!-- Content skeleton lines -->
  <rect x="58" y="130" width="200" height="8" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="58" y="150" width="158" height="8" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="58" y="170" width="178" height="8" rx="2" fill="rgba(255,255,255,0.1)"/>

  <!-- Mini button inside card -->
  <rect x="58" y="206" width="84" height="28" rx="4"
        fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="100" y="225"
        font-family="'Courier New',Courier,monospace"
        font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="1.5">ACTION</text>

  <!-- ── Corner radius callout (top-right of card) -->
  <path d="M304,76 Q304,68 296,68" fill="none" stroke="#FA872E" stroke-width="0.8"/>
  <line x1="304" y1="76" x2="316" y2="64" stroke="#FA872E" stroke-width="0.8"/>
  <text x="320" y="62"
        font-family="'Courier New',Courier,monospace"
        font-size="10" fill="#FA872E">rx: 8</text>

  <!-- ── Card width measurement (below card) -->
  <!-- Left tick -->
  <line x1="40" y1="292" x2="40" y2="302" stroke="#FA872E" stroke-width="0.8"/>
  <!-- Right tick -->
  <line x1="304" y1="292" x2="304" y2="302" stroke="#FA872E" stroke-width="0.8"/>
  <!-- Dashed span -->
  <line x1="40" y1="297" x2="304" y2="297" stroke="#FA872E" stroke-width="0.8" stroke-dasharray="4 2"/>
  <!-- Arrowheads -->
  <polygon points="40,293 46,297 40,301" fill="#FA872E"/>
  <polygon points="304,293 298,297 304,301" fill="#FA872E"/>
  <!-- Label -->
  <rect x="148" y="289" width="44" height="16" rx="2" fill="#0f1a28"/>
  <text x="170" y="301"
        font-family="'Courier New',Courier,monospace"
        font-size="10" fill="#FA872E" text-anchor="middle">264px</text>


  <!-- ═══════════════════════════════
       cw-button  (right, top)
       x=376 y=68 w=184 h=44 rx=4
  ══════════════════════════════════ -->
  <text x="376" y="58"
        font-family="'Courier New',Courier,monospace"
        font-size="10" fill="#4595D7" letter-spacing="0.08em">cw-button</text>

  <rect x="376" y="68" width="184" height="44" rx="4"
        fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <text x="468" y="95"
        font-family="'Courier New',Courier,monospace"
        font-size="11" fill="rgba(255,255,255,0.65)" text-anchor="middle" letter-spacing="2">SUBMIT</text>

  <!-- ── Button height measurement (right side) -->
  <!-- Top tick -->
  <line x1="566" y1="68" x2="576" y2="68" stroke="#FA872E" stroke-width="0.8"/>
  <!-- Bottom tick -->
  <line x1="566" y1="112" x2="576" y2="112" stroke="#FA872E" stroke-width="0.8"/>
  <!-- Dashed span -->
  <line x1="571" y1="68" x2="571" y2="112" stroke="#FA872E" stroke-width="0.8" stroke-dasharray="3 2"/>
  <!-- Arrowheads -->
  <polygon points="567,74 571,68 575,74" fill="#FA872E"/>
  <polygon points="567,106 571,112 575,106" fill="#FA872E"/>
  <!-- Label -->
  <text x="580" y="94"
        font-family="'Courier New',Courier,monospace"
        font-size="10" fill="#FA872E">44px</text>


  <!-- ═══════════════════════════════
       cw-input  (right, second)
       x=376 y=140 w=220 h=40 rx=4
  ══════════════════════════════════ -->
  <text x="376" y="132"
        font-family="'Courier New',Courier,monospace"
        font-size="10" fill="#4595D7" letter-spacing="0.08em">cw-input</text>

  <rect x="376" y="140" width="220" height="40" rx="4"
        fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Cursor blink -->
  <rect x="392" y="154" width="1.5" height="14" rx="1" fill="rgba(255,255,255,0.6)"/>

  <!-- ── Gap measurement (button → input): right side -->
  <line x1="608" y1="112" x2="618" y2="112" stroke="#FA872E" stroke-width="0.8"/>
  <line x1="608" y1="140" x2="618" y2="140" stroke="#FA872E" stroke-width="0.8"/>
  <line x1="613" y1="112" x2="613" y2="140" stroke="#FA872E" stroke-width="0.8" stroke-dasharray="3 2"/>
  <polygon points="609,118 613,112 617,118" fill="#FA872E"/>
  <polygon points="609,134 613,140 617,134" fill="#FA872E"/>
  <text x="622" y="130"
        font-family="'Courier New',Courier,monospace"
        font-size="10" fill="#FA872E">24px</text>


  <!-- ═══════════════════════════════
       cw-tag  (right, third)
       x=376 y=208 w=106 h=26 rx=13
  ══════════════════════════════════ -->
  <text x="376" y="200"
        font-family="'Courier New',Courier,monospace"
        font-size="10" fill="#4595D7" letter-spacing="0.08em">cw-tag</text>

  <rect x="376" y="208" width="106" height="26" rx="13"
        fill="rgba(255,255,255,0.055)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <text x="429" y="225"
        font-family="'Courier New',Courier,monospace"
        font-size="8.5" fill="rgba(255,255,255,0.5)" text-anchor="middle">In progress</text>


  <!-- ═══════════════════════════════
       cw-select  (right, bottom)
       x=376 y=264 w=220 h=40 rx=4
  ══════════════════════════════════ -->
  <text x="376" y="256"
        font-family="'Courier New',Courier,monospace"
        font-size="10" fill="#4595D7" letter-spacing="0.08em">cw-select</text>

  <rect x="376" y="264" width="220" height="40" rx="4"
        fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Chevron -->
  <polyline points="576,279 583,288 590,279"
            stroke="rgba(255,255,255,0.35)" stroke-width="1.5"
            fill="none" stroke-linecap="round" stroke-linejoin="round"/>


  <!-- ═══════════════════════════════
       Bottom watermark
  ══════════════════════════════════ -->
  <text x="350" y="410"
        font-family="'Courier New',Courier,monospace"
        font-size="9" fill="rgba(255,255,255,0.1)"
        text-anchor="middle" letter-spacing="4">CAUSEWAY DESIGN SYSTEM</text>
</svg>
